---
- name: Deploy the contact form
  hosts: local
  connection: local
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    aws_profile: "{{ lookup('env', 'AWS_PROFILE') | default('contact-form-deployer', true) }}"
    kubeconfig_path: "{{ lookup('env', 'KUBECONFIG') | default(repo_root ~ '/.local/kubeconfig', true) }}"
  environment:
    AWS_PROFILE: "{{ aws_profile }}"
    AWS_REGION: ap-southeast-1
    KUBECONFIG: "{{ kubeconfig_path }}"
  pre_tasks:
    - name: Require the private EKS tunnel kubeconfig
      ansible.builtin.assert:
        that:
          - kubeconfig_path is file
        fail_msg: "Run python3 scripts/open_tunnel.py in a separate terminal first."

    - name: Verify the deployment account
      ansible.builtin.command:
        argv:
          - aws
          - sts
          - get-caller-identity
          - --profile
          - "{{ aws_profile }}"
          - --output
          - json
      register: identity_result
      changed_when: false

    - name: Require the approved non-root account
      ansible.builtin.assert:
        that:
          - (identity_result.stdout | from_json).Account == '203888389134'
          - not (identity_result.stdout | from_json).Arn.endswith(':root')

    - name: Read the current workload outputs
      ansible.builtin.command:
        argv:
          - terraform
          - "-chdir={{ repo_root }}/terraform/workload"
          - output
          - -json
      register: terraform_result
      changed_when: false

    - name: Keep the output values for deployment
      ansible.builtin.set_fact:
        tf: "{{ terraform_result.stdout | from_json }}"

    - name: Require a validated public certificate
      ansible.builtin.assert:
        that:
          - tf.certificate_arn.value is string
          - tf.certificate_arn.value | length > 0
        fail_msg: "Apply the DNS-validated foundation certificate before deployment."

    - name: Verify the private cluster has two workers
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Node
      register: cluster_nodes

    - name: Require one Ready worker in each selected Availability Zone
      ansible.builtin.assert:
        that:
          - cluster_nodes.resources | length == 2
          - >-
            (cluster_nodes.resources |
            map(attribute='metadata.labels.demo_az') |
            list | sort) == (tf.availability_zones.value | sort)
        fail_msg: "Expected exactly one worker in each selected Availability Zone."

    - name: Require every worker to be Ready
      ansible.builtin.assert:
        that:
          - >-
            item.status.conditions |
            selectattr('type', 'equalto', 'Ready') |
            selectattr('status', 'equalto', 'True') |
            list | length == 1
      loop: "{{ cluster_nodes.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

  tasks:
    - name: Publish the committed app image or reuse its digest
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ repo_root }}/scripts/publish_image.py"
          - --profile
          - "{{ aws_profile }}"
          - --repository-url
          - "{{ tf.ecr_repository_url.value }}"
      register: image_result
      changed_when: image_result.rc == 0 and (image_result.stdout | from_json).published

    - name: Select the immutable application image
      ansible.builtin.set_fact:
        image_uri: "{{ (image_result.stdout | from_json).image_uri }}"

    - name: Ensure the application namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: contact-form

    - name: Bind the controller service account to its IAM role
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: aws-load-balancer-controller
            namespace: kube-system
            annotations:
              eks.amazonaws.com/role-arn: "{{ tf.controller_role_arn.value }}"

    - name: Register the AWS controller chart repository
      kubernetes.core.helm_repository:
        repo_name: eks
        repo_url: https://aws.github.io/eks-charts
        repo_state: present

    - name: Install the pinned AWS Load Balancer Controller
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        release_name: aws-load-balancer-controller
        release_namespace: kube-system
        release_state: present
        chart_ref: eks/aws-load-balancer-controller
        chart_version: 1.14.0
        wait: true
        timeout: 10m
        release_values:
          clusterName: "{{ tf.cluster_name.value }}"
          region: ap-southeast-1
          vpcId: "{{ tf.vpc_id.value }}"
          image:
            tag: v2.14.1
          serviceAccount:
            create: false
            name: aws-load-balancer-controller
          enableBackendSecurityGroup: false
          enableManageBackendSecurityGroupRules: false
          enableWaf: false
          enableWafv2: false
          enableShield: false
          replicaCount: 2

    - name: Bind the database setup service account to its IAM role
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: contact-form-db-setup
            namespace: contact-form
            annotations:
              eks.amazonaws.com/role-arn: "{{ tf.database_setup_role_arn.value }}"

    - name: Render the image-specific database setup Job
      ansible.builtin.set_fact:
        database_job_definition: "{{ lookup('template', playbook_dir ~ '/templates/database-job.yml.j2') | from_yaml }}"
      no_log: true

    - name: Inspect the existing database setup Job
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: batch/v1
        kind: Job
        namespace: contact-form
        name: "{{ database_job_definition.metadata.name }}"
      register: database_job_initial
      no_log: true

    - name: Wait for an existing running database setup Job
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: batch/v1
        kind: Job
        namespace: contact-form
        name: "{{ database_job_definition.metadata.name }}"
      register: database_job_existing_wait
      until: >-
        ((database_job_existing_wait.resources | default([]) | first | default({}))
        | database_job_state) in ['absent', 'complete', 'failed']
      retries: 60
      delay: 10
      when: >-
        ((database_job_initial.resources | first | default({}))
        | database_job_state) == 'running'
      ignore_errors: true
      no_log: true

    - name: Keep the latest database setup Job status
      ansible.builtin.set_fact:
        database_job_current: >-
          {{ database_job_existing_wait.resources
             | default(database_job_initial.resources)
             | first | default({}) }}
      no_log: true

    - name: Require the existing Job to finish within ten minutes
      ansible.builtin.assert:
        that:
          - (database_job_current | database_job_state) != 'running'
        fail_msg: "Could not establish a terminal state for the existing database setup Job within ten minutes."

    - name: Reuse a completed database setup Job
      ansible.builtin.debug:
        msg: "Reusing completed database setup Job {{ database_job_definition.metadata.name }}."
      when: (database_job_current | database_job_state) == 'complete'

    - name: Read pod status for a failed database setup Job
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Pod
        namespace: contact-form
        label_selectors:
          - "batch.kubernetes.io/job-name={{ database_job_definition.metadata.name }}"
      register: database_job_failed_pods
      when: (database_job_current | database_job_state) == 'failed'
      no_log: true

    - name: Report safe diagnostics before retrying the failed Job
      ansible.builtin.debug:
        msg: >-
          Database setup Job {{ database_job_definition.metadata.name }} failed:
          {{ database_job_current | database_job_diagnostics(database_job_failed_pods.resources) | to_json }}.
          Deleting it and retrying once.
      when: (database_job_current | database_job_state) == 'failed'

    - name: Delete the failed database setup Job
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: batch/v1
        kind: Job
        namespace: contact-form
        name: "{{ database_job_definition.metadata.name }}"
        wait: true
        wait_timeout: 120
      when: (database_job_current | database_job_state) == 'failed'

    - name: Create the missing or previously failed database setup Job
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition: "{{ database_job_definition }}"
      when: (database_job_current | database_job_state) in ['absent', 'failed']
      no_log: true

    - name: Wait for the new database setup Job to finish
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: batch/v1
        kind: Job
        namespace: contact-form
        name: "{{ database_job_definition.metadata.name }}"
      register: database_job_new_wait
      until: >-
        ((database_job_new_wait.resources | default([]) | first | default({}))
        | database_job_state) in ['complete', 'failed']
      retries: 60
      delay: 10
      when: (database_job_current | database_job_state) in ['absent', 'failed']
      ignore_errors: true
      no_log: true

    - name: Require the new database setup Job to finish within ten minutes
      ansible.builtin.assert:
        that:
          - >-
            ((database_job_new_wait.resources | default([]) | first | default({}))
            | database_job_state) in ['complete', 'failed']
        fail_msg: "The new database setup Job did not reach a terminal state within ten minutes."
      when: (database_job_current | database_job_state) in ['absent', 'failed']

    - name: Read pod status if the new database setup Job failed
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Pod
        namespace: contact-form
        label_selectors:
          - "batch.kubernetes.io/job-name={{ database_job_definition.metadata.name }}"
      register: database_job_new_failed_pods
      when: >-
        ((database_job_new_wait.resources | default([]) | first | default({}))
        | database_job_state) == 'failed'
      no_log: true

    - name: Report safe diagnostics for the new failed Job
      ansible.builtin.debug:
        msg: >-
          Database setup Job {{ database_job_definition.metadata.name }} failed:
          {{ (database_job_new_wait.resources | first)
             | database_job_diagnostics(database_job_new_failed_pods.resources) | to_json }}.
      when: >-
        ((database_job_new_wait.resources | default([]) | first | default({}))
        | database_job_state) == 'failed'

    - name: Stop deployment if the new database setup Job failed
      ansible.builtin.fail:
        msg: "Database setup failed; a subsequent run will recreate this failed Job."
      when: >-
        ((database_job_new_wait.resources | default([]) | first | default({}))
        | database_job_state) == 'failed'

    - name: Bind the Flask service account to its read-only secret role
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: contact-form
            namespace: contact-form
            annotations:
              eks.amazonaws.com/role-arn: "{{ tf.application_role_arn.value }}"

    - name: Ensure the ClusterIP service exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', playbook_dir ~ '/templates/service.yml.j2') | from_yaml }}"

    - name: Deploy two Flask replicas in separate zones
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', playbook_dir ~ '/templates/deployment.yml.j2') | from_yaml }}"
        wait: true
        wait_timeout: 600

    - name: Create the HTTPS Ingress that provisions one ALB
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', playbook_dir ~ '/templates/ingress.yml.j2') | from_yaml }}"

    - name: Wait for the controller to publish the ALB hostname
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Ingress
        namespace: contact-form
        name: contact-form
      register: ingress_result
      until: >-
        ingress_result.resources | length > 0 and
        ingress_result.resources[0].status.loadBalancer.ingress is defined and
        ingress_result.resources[0].status.loadBalancer.ingress | length > 0
      retries: 60
      delay: 10

    - name: Create the Route 53 alias for this controller-owned ALB
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ repo_root }}/scripts/manage_alb.py"
          - create
          - --profile
          - "{{ aws_profile }}"
          - --zone-id
          - "{{ tf.hosted_zone_id.value }}"
          - --domain
          - "{{ tf.domain_name.value }}"
          - --dns-name
          - "{{ ingress_result.resources[0].status.loadBalancer.ingress[0].hostname }}"
      register: alias_result
      until: alias_result.rc == 0
      retries: 12
      delay: 10
      changed_when: alias_result.rc == 0 and (alias_result.stdout | from_json).changed

    - name: Wait for HTTPS readiness through the controller ALB
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --max-time
          - "10"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --connect-to
          - "{{ tf.domain_name.value }}:443:{{ ingress_result.resources[0].status.loadBalancer.ingress[0].hostname }}:443"
          - "https://{{ tf.domain_name.value }}/health/ready"
      register: website_result
      until: website_result.rc == 0 and website_result.stdout == '200'
      retries: 60
      delay: 10
      changed_when: false

    - name: Wait for the public domain to resolve
      ansible.builtin.uri:
        url: "https://dns.google/resolve?name={{ tf.domain_name.value }}&type=A"
        method: GET
        status_code: 200
        return_content: true
        validate_certs: true
      register: public_dns_result
      until: >-
        public_dns_result.status | default(0) == 200 and
        public_dns_result.json.Status | default(1) == 0 and
        (public_dns_result.json.Answer | default([]) | selectattr('type', 'equalto', 1) | list | length) > 0
      retries: 60
      delay: 10
      changed_when: false

    - name: Verify HTTPS readiness through a publicly resolved address
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --max-time
          - "10"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --resolve
          - "{{ tf.domain_name.value }}:443:{{ public_dns_result.json.Answer | selectattr('type', 'equalto', 1) | map(attribute='data') | first }}"
          - "https://{{ tf.domain_name.value }}/health/ready"
      register: public_website_result
      until: public_website_result.rc == 0 and public_website_result.stdout == '200'
      retries: 12
      delay: 10
      changed_when: false
