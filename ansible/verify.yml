---
- name: Read a synthetic contact submission from private RDS
  hosts: local
  connection: local
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    aws_profile: "{{ lookup('env', 'AWS_PROFILE') | default('contact-form-deployer', true) }}"
    kubeconfig_path: "{{ lookup('env', 'KUBECONFIG') | default(repo_root ~ '/.local/kubeconfig', true) }}"
  environment:
    AWS_PROFILE: "{{ aws_profile }}"
    AWS_REGION: ap-southeast-1
    KUBECONFIG: "{{ kubeconfig_path }}"
  pre_tasks:
    - name: Require a synthetic email and the private API tunnel
      ansible.builtin.assert:
        that:
          - demo_email is defined
          - demo_email | default('') | length > 0
          - (demo_email | default('') | lower | regex_search('^[^@]+@example[.]com$')) is not none
          - kubeconfig_path is file
        fail_msg: "Submit synthetic data and pass -e demo_email=... while the SSM tunnel is open."

    - name: Verify the deployment account
      ansible.builtin.command:
        argv:
          - aws
          - sts
          - get-caller-identity
          - --profile
          - "{{ aws_profile }}"
          - --output
          - json
      register: identity_result
      changed_when: false

    - name: Require the approved non-root account
      ansible.builtin.assert:
        that:
          - (identity_result.stdout | from_json).Account == '203888389134'
          - not (identity_result.stdout | from_json).Arn.endswith(':root')

    - name: Read the current workload outputs
      ansible.builtin.command:
        argv:
          - terraform
          - "-chdir={{ repo_root }}/terraform/workload"
          - output
          - -json
      register: terraform_result
      changed_when: false

    - name: Keep the non-secret database endpoints and secret ARN
      ansible.builtin.set_fact:
        tf: "{{ terraform_result.stdout | from_json }}"

    - name: Read the deployed application image digest
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Deployment
        namespace: contact-form
        name: contact-form
      register: deployment_result

    - name: Require one deployed application
      ansible.builtin.assert:
        that:
          - deployment_result.resources | length == 1

    - name: Use the exact image deployed to the app
      ansible.builtin.set_fact:
        image_uri: "{{ deployment_result.resources[0].spec.template.spec.containers[0].image }}"

  tasks:
    - name: Remove an earlier readback Job
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: batch/v1
        kind: Job
        name: contact-form-readback
        namespace: contact-form
        wait: true
        wait_timeout: 120

    - name: Query matching rows from inside the private VPC
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', playbook_dir ~ '/templates/readback-job.yml.j2') | from_yaml }}"
        wait: true
        wait_condition:
          type: Complete
          status: "True"
        wait_timeout: 300

    - name: Show the matching synthetic rows
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - -n
          - contact-form
          - logs
          - job/contact-form-readback
      register: readback_result
      changed_when: false

    - name: Display the database evidence
      ansible.builtin.debug:
        msg: "{{ readback_result.stdout }}"
