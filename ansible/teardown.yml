---
- name: Remove application entry points before Terraform destroy
  hosts: local
  connection: local
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    aws_profile: "{{ lookup('env', 'AWS_PROFILE') | default('contact-form-deployer', true) }}"
    kubeconfig_path: "{{ lookup('env', 'KUBECONFIG') | default(repo_root ~ '/.local/kubeconfig', true) }}"
  environment:
    AWS_PROFILE: "{{ aws_profile }}"
    AWS_REGION: ap-southeast-1
    KUBECONFIG: "{{ kubeconfig_path }}"
  pre_tasks:
    - name: Require the still-running private EKS tunnel
      ansible.builtin.assert:
        that:
          - kubeconfig_path is file
        fail_msg: "Open the SSM tunnel before removing the Ingress."

    - name: Verify the deployment account
      ansible.builtin.command:
        argv:
          - aws
          - sts
          - get-caller-identity
          - --profile
          - "{{ aws_profile }}"
          - --output
          - json
      register: identity_result
      changed_when: false

    - name: Require the approved non-root account
      ansible.builtin.assert:
        that:
          - (identity_result.stdout | from_json).Account == '203888389134'
          - not (identity_result.stdout | from_json).Arn.endswith(':root')

    - name: Read the current workload outputs
      ansible.builtin.command:
        argv:
          - terraform
          - "-chdir={{ repo_root }}/terraform/workload"
          - output
          - -json
      register: terraform_result
      changed_when: false

    - name: Keep the output values for cleanup
      ansible.builtin.set_fact:
        tf: "{{ terraform_result.stdout | from_json }}"

  tasks:
    - name: Remember the Ingress hostname for the ALB deletion check
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Ingress
        namespace: contact-form
        name: contact-form
      register: ingress_before_cleanup

    - name: Keep the controller ALB hostname when available
      ansible.builtin.set_fact:
        alb_dns_name: "{{ (((ingress_before_cleanup.resources | first | default({})).get('status', {}).get('loadBalancer', {}).get('ingress', []) | first | default({})).get('hostname', '')) }}"

    - name: Remove only this deployment's DNS alias
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ repo_root }}/scripts/manage_alb.py"
          - remove
          - --profile
          - "{{ aws_profile }}"
          - --zone-id
          - "{{ tf.hosted_zone_id.value }}"
          - --domain
          - "{{ tf.domain_name.value }}"
      register: alias_result
      changed_when: alias_result.rc == 0 and (alias_result.stdout | from_json).changed

    - name: Remove the Ingress and let the controller delete the ALB
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: networking.k8s.io/v1
        kind: Ingress
        name: contact-form
        namespace: contact-form
        wait: true
        wait_timeout: 600

    - name: Block Terraform destroy until the ALB is gone
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ repo_root }}/scripts/manage_alb.py"
          - wait-deleted
          - --profile
          - "{{ aws_profile }}"
          - --timeout
          - "900"
          - --dns-name
          - "{{ alb_dns_name }}"
          - --vpc-id
          - "{{ tf.vpc_id.value }}"
      changed_when: false

    - name: Uninstall the AWS Load Balancer Controller
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        release_name: aws-load-balancer-controller
        release_namespace: kube-system
        release_state: absent
        wait: true
        timeout: 10m

    - name: Remove the controller service account
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: v1
        kind: ServiceAccount
        name: aws-load-balancer-controller
        namespace: kube-system

    - name: Remove the application namespace and its resources
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: v1
        kind: Namespace
        name: contact-form
        wait: true
        wait_timeout: 600
